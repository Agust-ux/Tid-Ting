<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prosjekt To Do Liste</title>
<link rel="stylesheet" href="css/style.css">

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
    }

    body{
        margin: 0;
    }

nav {
    position: relative;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 35px;
    background-color: #fff;
    box-shadow: 0 6px 40px rgba(0, 0, 0, 0.4);
    margin: 0;
}

nav img{
    height: 130px;
    width: 130px;
    border: solid 2px #000;
    border-radius: 40px;
}

nav h1 {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    font-family: Italianno;
    font-size: 70px;
    font-weight: 500;
    letter-spacing: 5px;
    color: var(--color5);
}

nav button{
    padding: 5px 20px;
    background-color: #fff;
    border: none;
    border-bottom: solid 2px var(--color4);
    font-family: Inter;
    font-size: 20px;
    margin: 10px;
    font-weight: 300;
    color: #000;
}

nav button:hover{
    background-color: var(--color4);
    color: #fff;
    transition: background-color 0.4s ease-in-out, width 0.5s ease-in-out; 
    border-radius: 10px;
}

nav .logo-link,
nav .title-link {
    text-decoration: none;
    color: inherit;
    display: flex;
    align-items: center;
}

nav img {
    display: block;
}

nav .title-link h1 {
    margin: 0;
    line-height: 1;
}

    body {
        background: #ffffff;
        margin: 0;
    }

    .header {
        background: #e6e6e6;
        padding: 20px;
        text-align: center;
        font-size: 28px;
        font-weight: 500;
        border-radius: 10px;
        margin-bottom: 40px;
        margin: 40px;
    }

    .project-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 40px;
        padding: 40px;
    }

    .project-card {
        background: #e6e6e6;
        padding: 30px;
        border-radius: 20px;
        transition: 0.3s;
        position: relative;
    }

    .project-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }

    .project-card.active {
        border: 4px solid #1976d2;
    }

    .project-title {
        font-size: 26px;
        margin-bottom: 20px;
    }

    .task {
        display: flex;
        align-items: center;
        margin-bottom: 18px;
    }

    .task input {
        margin-right: 10px;
        width: 18px;
        height: 18px;
    }

    .task-details {
        font-size: 14px;
    }

    .task-time {
        font-size: 12px;
        color: #555;
        margin-top: 2px;
    }

    .timeline-btn {
        margin-top: 20px;
        padding: 10px 18px;
        background: #5c5c5c;
        color: white;
        border: none;
        border-radius: 20px;
        cursor: pointer;
        font-size: 14px;
        transition: 0.3s;
    }

    .timeline-btn:hover {
        background: #333;
    }

    .add-project {
        margin-top: 40px;
        text-align: center;
    }

    .add-project button {
        padding: 12px 25px;
        font-size: 16px;
        border-radius: 25px;
        border: none;
        background: #1976d2;
        color: white;
        cursor: pointer;
        transition: 0.3s;
    }

    .add-project button:hover {
        background: #125ca1;
    }

    .modal {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.4);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 999;
    }

    .hidden {
        display: none;
    }

    .modal-content {
        background: white;
        padding: 30px;
        border-radius: 20px;
        width: 400px;
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    .modal-content input,
    .modal-content textarea {
        padding: 12px;
        border-radius: 10px;
        border: 1px solid #ccc;
        font-size: 16px;
    }

    .modal-buttons {
        display: flex;
        gap: 10px;
    }

    .modal-buttons button {
        flex: 1;
        padding: 12px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
    }

    .project-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

    .hidden {
        display: none !important;
    }

    .menu-wrapper {
        position: relative;
    }

    .menu-btn {
        background: none;
        border: none;
        font-size: 22px;
        cursor: pointer;
    }

    .menu {
        position: absolute;
        right: 0;
        top: 25px;
        background: white;
        border: 1px solid #ddd;
        border-radius: 10px;
        display: flex;
        flex-direction: column;
        min-width: 140px;
        z-index: 10;
    }

    .menu-item {
        padding: 10px;
        border: none;
        background: none;
        text-align: left;
        cursor: pointer;
    }

    .menu-item:hover {
        background: #f2f2f2;
    }

    .menu-item.delete {
        color: red;
    }

    .details-btn {
        margin-top: 12px;
        width: 100%;
        padding: 10px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        background: #1976d2;
        color: white;
    }

    .details-btn:hover {
        background: #125ca1;
    }
</style>
</head>

<body>
        <nav>
            <a href="index.html" class="logo-link">
                <img src="Images/Logo.png" alt="Nettside logo">
            </a>

            <a href="index.html" class="title-link">
                <h1>Tid <br> & Ting</h1>
            </a>
        <div id="button_holders">
            <a href="calendar.html"><button>Kalendar</button></a>
            <a href="reminders.html"><button>Påminnelser</button></a>
        </div>
    </nav>
<br>
<div class="header">
    Prosjekt To Do Liste
</div>

<div class="project-grid" id="projectGrid"></div>

<div class="add-project">

    <button id="openProjectModal">
        + Legg til nytt prosjekt
    </button>

</div>

<div class="modal hidden" id="projectModal">
    <div class="modal-content">
        <h2>Nytt prosjekt</h2>

        <input
            type="text"
            id="projectTitle"
            placeholder="Project title"
        >

        <textarea
            id="projectDescription"
            placeholder="Description"
        ></textarea>

        <input
            type="date"
            id="projectStart"
        >

        <input
            type="date"
            id="projectEnd"
        >

        <div class="modal-buttons">
            <button id="saveProjectBtn">
                Save Project
            </button>

            <button id="closeModalBtn">
                Cancel
            </button>
        </div>
    </div>

</div>
<script src="js/script.js"></script>
</body>
</html>
