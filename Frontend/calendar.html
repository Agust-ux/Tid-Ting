<!--Dette er kalendaeren med alt av prosjekt tidslinjer. Alt her sendes til å lage en ny prosjekt eller blir hentet når det er en ny prosjekt-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Timeline Calendar</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/calendar.css">
</head>
<body>
        <nav>
            <a href="index.html" class="logo-link">
                <img src="Images/Logo.png" alt="Nettside logo">
            </a>

            <a href="index.html" class="title-link">
                <h1>Tid & Ting</h1>
            </a>
        <div id="button_holders">
            <a href="calendar.html"><button><b>Kalendar</b></button></a>
            <a href="reminders.html"><button><b>Påminnelser</b></button></a>
        </div>
    </nav>

    <br><br><br>
<div class="app">

  <div class="heading">
    <div id="monthInfo">
      <button id="prevMonth">←</button>
      <h1 id="monthLabel"></h1>
      <button id="nextMonth">→</button>
    </div>
    <div id="knapper">
    <button id="addProject">+ Legg til nytt prosjekt</button>
    <a href="reminders.html"><button id="to-do">Se To-Do lister</button></a>
    </div>
  </div>

  <div class="calendar-wrapper">
    <div class="calendar-grid" id="calendar"></div>
    <div class="timeline-layer" id="timelines"></div>
  </div>

  <footer class="footer">Footer</footer>
</div>

<!-- MODAL -->

<div class="modal hidden" id="modal">
  <div class="modal-content">
    <input id="titleInput" placeholder="Project title" />
    <input id="startInput" type="date" />
    <input id="endInput" type="date" />

    <select id="colorInput">
      <option value="rgba(131,216,91,0.6)">Green</option>
      <option value="rgba(255,96,41,0.6)">Orange</option>
      <option value="rgba(108,66,112,0.6)">Purple</option>
    </select>

    <textarea id="notesInput" placeholder="Notes"></textarea>
    <button>+ Legg til to-do liste</button> <!--Dette kan lage en ny to-do liste for prosjektet.-->

    <div class="modal-actions">
      <button id="saveProject">Save</button>
      <button id="closeModal">Cancel</button>
      <button id="deleteProject" class="hidden">Delete</button>
    </div>
  </div>
</div>

<script src="js/calendar.js"></script>
</body>
</html>
