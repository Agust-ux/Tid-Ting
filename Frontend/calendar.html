<!--Dette er kalendaeren med alt av prosjekt tidslinjer. Alt her sendes til å lage en ny prosjekt eller blir hentet når det er en ny prosjekt-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Timeline Calendar</title>
<link rel="stylesheet" href="css/style.css">

<style>
  :root {
  --text: #1f1f1f;
  --muted: rgba(0,0,0,0.5);
  --shadow: 0 10px 30px rgba(0,0,0,0.08);
  --radius: 16px;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  background: var(--color2);
  color: var(--text);
}

/* =========================
   LAYOUT
========================= */

.app {
  max-width: 1200px;
  margin: 0 auto;
  padding: 24px;
}

/* =========================
   TOP HEADER
========================= */

.heading {
  display: flex;
  justify-content: space-between;
  align-items: center;

  padding: 16px 20px;
  margin-bottom: 18px;

  background: var(--color3);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}

/* MONTH AREA */
#monthInfo {
  display: flex;
  align-items: center;
  gap: 16px;
}

/* BIG MONTH TEXT */
#monthLabel {
  font-size: 34px;
  font-weight: 800;
  letter-spacing: 0.5px;
  margin: 0;
}

/* ARROW BUTTONS */
#prevMonth,
#nextMonth {
  width: 44px;
  height: 44px;

  border-radius: 12px;
  border: 1px solid rgba(0,0,0,0.08);
  background: white;

  font-size: 18px;
  font-weight: 700;

  cursor: pointer;

  display: flex;
  align-items: center;
  justify-content: center;

  transition: 0.2s ease;
  box-shadow: 0 4px 10px rgba(0,0,0,0.06);
}

#prevMonth:hover,
#nextMonth:hover {
  transform: translateY(-2px);
  background: rgba(128, 223, 109, 0.12);
  border-color: rgba(128, 223, 109, 0.4);
  box-shadow: 0 8px 18px rgba(0,0,0,0.1);
}

/* RIGHT ACTION BUTTONS */
#knapper {
  display: flex;
  gap: 12px;
  align-items: center;
}

#addProject,
#to-do {
  padding: 5px 26px;
  margin: 10px;
  border-radius: 10px;
  cursor: pointer;
  color: black;
  font-weight: 600;

  transition: 0.2s ease;
  box-shadow: 0 6px 14px rgba(0,0,0,0.08);
}

/* primary */
#addProject {
  background: #74ca6347;
  border: 2px solid var(--color1);
}

/* secondary */
#to-do {
  background: #b137b831;
  border: 2px solid var(--color5);
}

#addProject:hover,
#to-do:hover {
  transform: translateY(-2px);
  filter: brightness(1.05);
}

/* =========================
   CALENDAR GRID
========================= */

.calendar-wrapper {
  position: relative;
  background: var(--color3);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
}

.calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 1px;
  background: #eaeaea;
}

/* WEEKDAYS */
.weekday {
  background: #fafafa;
  padding: 10px;
  text-align: center;
  font-size: 12px;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 700;
}

/* DAY CELLS */
.day {
  min-height: 100px;
  background: var(--color3);
  padding: 10px;
  position: relative;

  font-size: 14px;
  font-weight: 500;

  transition: 0.15s ease;
  cursor: pointer;
}

.day:hover {
  background: rgba(128, 223, 109, 0.08);
  transform: scale(1.01);
}

/* =========================
   TIMELINES
========================= */

.timeline-layer {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

.timeline {
  position: absolute;
  height: 18px;
  border-radius: 999px;

  display: flex;
  align-items: center;

  padding: 0 10px;
  font-size: 11px;
  font-weight: 700;
  color: white;

  box-shadow: 0 6px 14px rgba(0,0,0,0.15);
  pointer-events: auto;

  opacity: 0.65;
  transition: 0.2s ease;

  white-space: nowrap;
  overflow: hidden;
}

.timeline:hover {
  opacity: 0.9;
  transform: scaleY(1.15);
}

/* =========================
   FOOTER
========================= */

.footer {
  margin-top: 20px;
  padding: 16px;
  text-align: center;
  color: var(--muted);
  font-size: 13px;
}

/* =========================
   MODAL
========================= */

.modal {
  position: fixed;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;

  background: rgba(0,0,0,0.35);
  backdrop-filter: blur(6px);
  z-index: 1000;
}

.modal.hidden {
  display: none;
}

.modal-content {
  width: 420px;
  background: var(--color3);
  border-radius: var(--radius);
  padding: 20px;

  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.modal-content input,
.modal-content textarea,
.modal-content select {
  width: 100%;
  padding: 10px 12px;
  border-radius: 12px;
  border: 1px solid #e6e6e6;
  outline: none;
  font-size: 14px;
  background: #fafafa;
}

.modal-content textarea {
  min-height: 90px;
  resize: vertical;
}

.modal-content input:focus,
.modal-content textarea:focus,
.modal-content select:focus {
  border-color: var(--color5);
}

/* MODAL BUTTONS */
.modal-actions {
  display: flex;
  gap: 10px;
  margin-top: 10px;
}

.modal-actions button {
  flex: 1;
  padding: 10px;
  border-radius: 12px;
  border: none;
  cursor: pointer;
  font-weight: 700;
  transition: 0.2s ease;
}

/* SAVE */
#saveProject {
  background: var(--color1);
}

/* CANCEL */
#closeModal {
  background: var(--color2);
}

/* DELETE */
#deleteProject {
  background: #ff5c5c;
  color: white;
}

.modal-actions button:hover {
  transform: translateY(-1px);
  filter: brightness(1.05);
}
</style>
</head>
<body>
        <nav>
            <a href="index.html" class="logo-link">
                <img src="Images/Logo.png" alt="Nettside logo">
            </a>

            <a href="index.html" class="title-link">
                <h1>Tid & Ting</h1>
            </a>
        <div id="button_holders">
            <a href="calendar.html"><button><b>Kalendar</b></button></a>
            <a href="reminders.html"><button><b>Påminnelser</b></button></a>
        </div>
    </nav>

    <br><br><br>
<div class="app">

  <div class="heading">
    <div id="monthInfo">
      <button id="prevMonth">←</button>
      <h1 id="monthLabel"></h1>
      <button id="nextMonth">→</button>
    </div>
    <div id="knapper">
    <button id="addProject">+ Add Project</button>
    <a href="reminders.html"><button id="to-do">See To-Do tables</button></a>
    </div>
  </div>

  <div class="calendar-wrapper">
    <div class="calendar-grid" id="calendar"></div>
    <div class="timeline-layer" id="timelines"></div>
  </div>

  <footer class="footer">Footer</footer>
</div>

<!-- MODAL -->

<div class="modal hidden" id="modal">
  <div class="modal-content">
    <input id="titleInput" placeholder="Project title" />
    <input id="startInput" type="date" />
    <input id="endInput" type="date" />

    <select id="colorInput">
      <option value="rgba(131,216,91,0.6)">Green</option>
      <option value="rgba(255,96,41,0.6)">Orange</option>
      <option value="rgba(108,66,112,0.6)">Purple</option>
    </select>

    <textarea id="notesInput" placeholder="Notes"></textarea>
    <button>+ Legg til to-do liste</button> <!--Dette kan lage en ny to-do liste for prosjektet.-->

    <div class="modal-actions">
      <button id="saveProject">Save</button>
      <button id="closeModal">Cancel</button>
      <button id="deleteProject" class="hidden">Delete</button>
    </div>
  </div>
</div>

<script src="js/calendar.js"></script>
</body>
</html>
