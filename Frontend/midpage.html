<!--Dette er landingssiden om man trykker direkte på reminders knappen. Du kan enten lage en vanlig to do liste(Samme funksjonalitet som prosjekt to-do lister) eller lage flere under en prosjekt-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Påminnelser landingsside</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <style>
        body {
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 0;
  background-color: #f6f6f6;
  color: #222;
}

    body{
        margin: 0;
    }

.panel-container {
    width: 90%;
    max-width: 850px;
    margin: 60px auto;

    display: flex;
    flex-direction: column;
    gap: 18px;
}

.panel {
    background: white;
    border: 1px solid #ececec;
    border-radius: 18px;

    padding: 24px 28px;

    display: flex;
    align-items: center;
    gap: 20px;

    transition: 0.2s ease;
    cursor: pointer;
}

.panel:hover {
    transform: translateY(-2px);
    border-color: var(--color4);
    box-shadow: 0 8px 24px rgba(0,0,0,0.06);
}

.panel-icon {
    width: 52px;
    height: 52px;

    border-radius: 14px;

    background: var(--color3);

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 24px;
}

.panel-text h2 {
    margin: 0;
    font-family: Inter;
    font-size: 21px;
    font-weight: 600;
    color: #222;
}

.panel-text p {
    margin-top: 5px;

    font-family: Inter;
    font-size: 15px;
    color: #777;
}
    </style>

<div class="panel-container">

    <div class="panel">
        <div class="panel-icon">✓</div>

        <div class="panel-text">
            <h2>Classic To-Do</h2>
            <p>En klassisk to-do liste for dagen</p>
        </div>
    </div>

    <div class="panel">
        <div class="panel-icon">📁</div>

        <div class="panel-text">
            <h2>Projects</h2>
            <p>Organizering av større prosjekter.</p>
        </div>
    </div>

</div>
